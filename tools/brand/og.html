<!doctype html>
<!-- ============================================================================
   The 1200x630 share image (assets/og-default.jpg), rendered by
   tools/build-brand-marks.py through headless Chrome. It is rebuilt from the
   original photograph and the site's own type — the previous JPG had the ring
   mark baked into it, and pixels cannot be edited out of a flattened photo.

   Same content as before: mark + wordmark top-left, the headline and its subline
   low on the frame, the coordinates and a gold tick. Only the mark changed.
   ============================================================================ -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: 'Libre Caslon Display'; src: url('../../assets/fonts/libre-caslon-display-400-latin.woff2') format('woff2'); }
  @font-face { font-family: 'Libre Caslon Text'; font-style: italic; src: url('../../assets/fonts/libre-caslon-text-400-italic-latin.woff2') format('woff2'); }
  @font-face { font-family: 'Hanken Grotesk'; font-weight: 400; src: url('../../assets/fonts/hanken-grotesk-400-latin.woff2') format('woff2'); }
  @font-face { font-family: 'Hanken Grotesk'; font-weight: 600; src: url('../../assets/fonts/hanken-grotesk-600-latin.woff2') format('woff2'); }

  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #12302F; }
  .frame { position: relative; width: 1200px; height: 630px;
           background: url('../../assets/hero-saint-lucia.jpg') center 38% / cover no-repeat; }
  /* Darkened toward the bottom-left, where the type sits, and a little at the top
     for the wordmark — the same read as the previous image. */
  .frame::before { content: ''; position: absolute; inset: 0;
    background:
      linear-gradient(180deg, rgba(10,22,24,.55) 0%, rgba(10,22,24,.10) 22%, rgba(10,22,24,.20) 52%, rgba(10,22,24,.78) 100%),
      linear-gradient(90deg, rgba(10,22,24,.40) 0%, rgba(10,22,24,0) 60%); }
  .brand { position: absolute; left: 68px; top: 58px; display: flex; align-items: center; gap: 22px; color: #FBF8F1; }
  .brand svg { display: block; }
  .brand span { font: 600 21px/1 'Hanken Grotesk', sans-serif; letter-spacing: .14em; text-transform: uppercase; }
  .brand span b { color: #D9A03C; font-weight: 600; }
  h1 { position: absolute; left: 72px; top: 296px; margin: 0; width: 1050px;
       font: 400 68px/1.06 'Libre Caslon Display', Georgia, serif; color: #FBF8F1; letter-spacing: -.005em;
       text-shadow: 0 2px 26px rgba(8,16,18,.55); }
  .sub { position: absolute; left: 72px; top: 386px; margin: 0;
         font: italic 400 26px/1.3 'Libre Caslon Text', Georgia, serif; color: #E9E4D8; text-shadow: 0 2px 18px rgba(8,16,18,.55); }
  .tick { position: absolute; left: 72px; top: 468px; width: 2px; height: 34px; background: #D9A03C; }
  .coords { position: absolute; left: 72px; top: 522px; margin: 0;
            font: 400 15px/1 'Hanken Grotesk', sans-serif; letter-spacing: .2em; color: #E9E4D8; }
</style>
</head>
<body>
<div class="frame">
  <div class="brand">
    <!-- Same geometry as lib/brand.js pitonsMark(); line paper, sun coral. -->
    <svg width="92" height="40" viewBox="0 0 92 40" aria-hidden="true">
      <polyline points="3,37 30,4.5 46,21.5 65,2.5 89,37" fill="none" stroke="#FBF8F1" stroke-width="3" stroke-linejoin="miter" stroke-miterlimit="6"/>
      <circle cx="46" cy="11.5" r="3.2" fill="#EF6A4A"/>
    </svg>
    <span>Discover Saint Lucia <b>WELL</b></span>
  </div>
  <h1>Wellbeing, designed by the island.</h1>
  <p class="sub">Six wellness villages. One island.</p>
  <div class="tick"></div>
  <p class="coords">13°54′N&nbsp;&nbsp;&nbsp;60°58′W</p>
</div>
</body>
</html>
